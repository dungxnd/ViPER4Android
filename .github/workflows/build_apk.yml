name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0  # required by llm-release-action for full commit history

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      # ── Signing setup ──────────────────────────────────────────────────────
      # Runs only when the required secrets are present (skipped on forks/PRs
      # without access to secrets).
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Write local.properties (signed)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cat >> local.properties <<EOF
          KEYSTORE_FILE=${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --build-cache

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --build-cache

      # ── Resolve version for artifact naming & bump detection ──────────────
      - name: Extract version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

          # Detect whether versionName changed vs the previous commit.
          # On a first commit (no parent) git diff exits 128 — treat as bumped.
          if git diff HEAD~1 HEAD -- app/build.gradle.kts 2>/dev/null \
               | grep -q '^+.*versionName'; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Rename outputs ────────────────────────────────────────────────────
      - name: Rename APKs
        run: |
          mkdir -p artifacts
          # Debug
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/ViPER4Android-${{ steps.version.outputs.name }}-debug.apk
          # Release — signed or unsigned depending on secrets availability
          RELEASE_APK=$(ls app/build/outputs/apk/release/app-release*.apk | head -1)
          cp "$RELEASE_APK" \
             artifacts/ViPER4Android-${{ steps.version.outputs.name }}.apk

      # ── Upload artifacts (every build) ────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: artifacts/ViPER4Android-${{ steps.version.outputs.name }}-debug.apk
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: artifacts/ViPER4Android-${{ steps.version.outputs.name }}.apk
          retention-days: 30

      # ── GitHub Release (tag pushes OR versionName bump on branch push) ────
      - name: Collect changes for changelog
        id: changes
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (
            github.event_name == 'push' &&
            steps.version.outputs.bumped == 'true'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.name) }}"

          PREV_TAG=$(gh release list --repo "${{ github.repository }}" \
            --exclude-drafts --limit 10 --json tagName \
            | jq -r '.[].tagName' \
            | grep -v "^${TAG}$" | head -1)

          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "${PREV_TAG}..HEAD" \
              --pretty=format:"- %s (%h) by %an" 2>/dev/null || true)
          else
            LOG=$(git log --max-count=30 \
              --pretty=format:"- %s (%h) by %an" 2>/dev/null || true)
          fi
          [ -z "$LOG" ] && LOG="(no commits found)"

          CONTENT_FILE=$(mktemp)
          echo "## ViPER4Android" > "$CONTENT_FILE"
          echo "### Commits"     >> "$CONTENT_FILE"
          echo "$LOG"            >> "$CONTENT_FILE"

          DELIM="CHANGES_$(openssl rand -hex 8)"
          {
            echo "content<<${DELIM}"
            cat "$CONTENT_FILE"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate LLM changelog
        id: llm
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (
            github.event_name == 'push' &&
            steps.version.outputs.bumped == 'true'
          )
        uses: nosovj/llm-release-action@v1
        with:
          model: openrouter/dots-studio/dots-3-note-preview:free
          current_version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          content_override: ${{ steps.changes.outputs.content }}
          changelog_config: |
            default:
              preset: developer
              emojis: true
              include_commits: false
              include_contributors: true
              link_prs: true
              link_issues: true
              generate_summary: true
              sections: [breaking, security, features, improvements, fixes, performance, infrastructure, docs]
        env:
          OPENROUTER_API_KEY: ${{ secrets.OR_KEY }}

      - name: Write release body
        id: body
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (
            github.event_name == 'push' &&
            steps.version.outputs.bumped == 'true'
          )
        run: |
          echo '${{ steps.llm.outputs.changelogs }}' \
            | jq -r '.default.en // "(no changelog generated)"' \
            > artifacts/changelog.md

      - name: Create GitHub Release
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          (
            github.event_name == 'push' &&
            steps.version.outputs.bumped == 'true'
          )
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          files: |
            artifacts/ViPER4Android-${{ steps.version.outputs.name }}.apk
            artifacts/ViPER4Android-${{ steps.version.outputs.name }}-debug.apk
          body_path: artifacts/changelog.md
